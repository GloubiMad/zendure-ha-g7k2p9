# === Carte DIAGNOSTIC du moteur fondation (Plotly) ===
# Carte HACS dbuezas : type = custom:plotly-graph (PAS "-card"). A coller en carte MANUELLE.
# Piege YAML : la cle "y" doit etre quotee, sinon YAML 1.1 la lit comme le booleen true.
#
# CE QU'IL FAUT Y VOIR :
#  - "Regime" (axe de droite, 0=repos 1=charge 2=decharge) : s'il saute sans arret,
#    c'est un probleme de STABILITE -> baisser "lissage house load" (40 -> 25 %)
#    ou baisser "seuil de coupure" (30 -> 20 W). Cf. PARAMETRES_FONDATION.md.
#  - "Integrateur" : doit rester proche de ZERO. S'il monte a plusieurs centaines et y
#    reste, c'est que les deux Hyper sont SATURES (conso > 2400 W) : c'est normal, et
#    l'anti-windup l'empeche desormais de s'emballer. S'il oscille fort, baisser le
#    "pas de l'integrateur".
#  - "Deversement force" : non nul = glagla est PLEINE et pousse son solaire malgre tout.
#  - "SoC up" doit monter les jours de surplus. S'il stagne alors que glagla encaisse,
#    baisser le "seuil routage surplus (engagement)".
type: custom:plotly-graph
title: Fondation — diagnostic (régime, intégrateur, SoC)
hours_to_show: 12
refresh_interval: 30
layout:
  height: 380
  margin: { l: 55, r: 55, t: 40, b: 30 }
  legend: { orientation: h, y: -0.18 }
  yaxis:
    title: W
    zeroline: true
    zerolinewidth: 2
    zerolinecolor: "#888"
  yaxis2:
    title: Régime / SoC
    overlaying: y
    side: right
    range: [-0.2, 100]
entities:
  - entity: sensor.zendure_manager_fondation_integral
    name: Intégrateur (doit rester ~0)
    line: { width: 3, color: "#8e44ad" }

  - entity: sensor.zendure_manager_fondation_setpoint
    name: Consigne totale (setpoint)
    line: { width: 2, color: "#16a085" }

  - entity: sensor.zendure_manager_fondation_forced
    name: Déversement forcé (onduleur plein)
    line: { width: 2, color: "#c0392b", dash: dash }

  - entity: sensor.zendure_manager_fondation_state
    name: Régime (0 repos / 1 charge / 2 décharge)
    "yaxis": y2
    line: { width: 2, color: "#7f8c8d", shape: hv }
    filters:
      - multiply: 20

  - entity: sensor.hyper_2000_up_electric_level
    name: up — SoC (%)
    "yaxis": y2
    line: { width: 2, color: "#27ae60", dash: dot }

  - entity: sensor.hyper_2000_glagla_electric_level
    name: glagla — SoC (%)
    "yaxis": y2
    line: { width: 2, color: "#f39c12", dash: dot }
