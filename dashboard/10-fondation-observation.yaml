  - type: divider
  - entity: sensor.zendure_manager_fondation_house_load
    name: Demande maison (house load)
  - entity: sensor.zendure_manager_fondation_setpoint
    name: Consigne totale (setpoint)
  - entity: sensor.zendure_manager_fondation_integral
    name: Intégrateur (doit rester ~0)
  - entity: sensor.zendure_manager_fondation_forced
    name: Déversement forcé (onduleur plein)
  - type: divider
  - entity: sensor.hyper_2000_glagla_electric_level
    name: glagla — SoC
  - entity: sensor.hyper_2000_up_electric_level
    name: up — SoC
  - entity: sensor.hyper_2000_glagla_output_pack_power
    name: glagla — encaisse (doit rester ~0)
