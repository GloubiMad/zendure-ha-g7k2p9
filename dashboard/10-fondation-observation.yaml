# === 10 - Fondation : observation ===
# A coller en carte MANUELLE. Carte HA native (l'editeur visuel fonctionne).
# Le tableau de bord a regarder AVANT de toucher a un reglage.
type: entities
title: Fondation — observation
show_header_toggle: false
state_color: true
entities:
